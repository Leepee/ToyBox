<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toy Playground</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="app">
    <h1>🧸 ToyBox</h1>
    <span class="sub">Toy playground: write a toy, see it on the video live</span>
    <nav><a href="./">Player</a><a href="./playground.html">Toy playground</a></nav>
  </header>
  <main class="playground">
    <section class="editor">
      <div class="toolbar">
        <select class="btn" id="example" aria-label="Start from an example">
          <option value="">Start from…</option>
          <option value="starter">Blank starter (number line)</option>
          <option value="toys/fraction-builder.html">Fraction builder</option>
          <option value="toys/quiz.html">Quiz</option>
          <option value="toys/fact-card.html">Fact card</option>
        </select>
        <button class="btn primary" id="apply">Run on video (⌘↵)</button>
        <button class="btn" id="copy">Copy cue JSON</button>
      </div>
      <div>
        <label for="toy-html">Toy HTML</label>
        <textarea id="toy-html" spellcheck="false" wrap="off"></textarea>
      </div>
      <div>
        <label for="toy-params">Params (JSON passed to <code>ToyBox.onInit</code>)</label>
        <textarea id="toy-params" spellcheck="false">{}</textarea>
      </div>
      <div class="fields">
        <div><label for="f-start">Start (s)</label><input id="f-start" type="number" step="0.5" value="3" /></div>
        <div><label for="f-end">End (s)</label><input id="f-end" type="number" step="0.5" value="5" /></div>
        <div><label for="f-x">X %</label><input id="f-x" type="number" value="20" /></div>
        <div><label for="f-y">Y %</label><input id="f-y" type="number" value="12" /></div>
        <div><label for="f-w">W %</label><input id="f-w" type="number" value="60" /></div>
        <div><label for="f-h">H %</label><input id="f-h" type="number" value="62" /></div>
      </div>
      <div class="toolbar">
        <label style="margin:0"><input type="checkbox" id="f-pause" checked /> Pause video when toy appears</label>
        <label style="margin:0"><input type="checkbox" id="f-resume" checked /> Resume on complete</label>
      </div>
      <div class="err" id="err"></div>
    </section>
    <section style="display:flex;flex-direction:column;gap:12px">
      <div id="player"></div>
      <div class="panel">
        <h2>Messages from your toy</h2>
        <pre class="out" id="out">Press "Run on video". The player will jump to your toy's start time.</pre>
      </div>
    </section>
  </main>
  <script type="module" src="/src/playground.ts"></script>
</body>
</html>
