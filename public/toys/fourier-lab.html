<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fourier Lab</title>
  <script src="../toybox-sdk.js"></script>
  <style>
    :root { --amber: #f59e0b; --cyan: #22d3ee; --pink: #f472b6; --green: #4ade80; --violet: #a78bfa; --muted: #94a3b8; font-family: system-ui, -apple-system, sans-serif; color: #e5e7eb; }
    html, body { margin: 0; height: 100%; background: transparent; }
    .card {
      box-sizing: border-box; height: 100vh; padding: 2vh 2vw; gap: 1.4vh;
      background: #0b1020f5; border: 1px solid #ffffff26; border-radius: 16px; box-shadow: 0 12px 40px #000a;
      display: grid; grid-template-rows: auto auto 1fr auto;
      font-size: clamp(11px, 1.7vw, 15px);
    }
    header { display: flex; align-items: center; gap: 1.2vw; flex-wrap: wrap; }
    h1 { margin: 0; font-size: clamp(15px, 2.6vw, 24px); }
    .tabs { display: inline-flex; background: #ffffff12; border-radius: 999px; padding: 3px; }
    .tabs button { border: 0; background: none; color: var(--muted); padding: .35em 1em; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer; }
    .tabs button[aria-selected=true] { background: var(--amber); color: #1c1203; }
    .hint { color: var(--muted); }
    .row { display: flex; gap: .5vw; flex-wrap: wrap; align-items: center; min-height: 2em; }
    .chip { font: inherit; border: 1px solid #ffffff2e; background: #ffffff0d; color: inherit; border-radius: 999px; padding: .3em .9em; cursor: pointer; }
    .chip:hover { background: #ffffff1f; }
    .chip.on { border-color: var(--amber); color: var(--amber); }
    .panes { display: grid; grid-template-columns: 3fr 2fr; gap: 1.4vw; min-height: 0; }
    .pane { display: grid; grid-template-rows: auto 1fr; gap: .6vh; min-height: 0; }
    .pane h2 { margin: 0; font-size: 1em; font-weight: 700; display: flex; justify-content: space-between; }
    .pane h2 small { font-weight: 500; color: var(--muted); }
    canvas { width: 100%; height: 100%; min-height: 0; display: block; border-radius: 10px; background: #070b17; touch-action: none; }
    #wave.drawable { cursor: crosshair; }
    #spec.editable { cursor: ns-resize; }
    footer { display: flex; align-items: center; gap: 1vw; flex-wrap: wrap; }
    footer label { font-weight: 600; }
    #k { accent-color: var(--amber); width: min(30vw, 240px); }
    button.main { font: inherit; border: 1px solid #ffffff33; background: #ffffff10; color: inherit; border-radius: 999px; padding: .45em 1em; cursor: pointer; }
    button.go { margin-left: auto; background: #1e3a8a; border-color: transparent; }
    .match { font-variant-numeric: tabular-nums; color: var(--green); font-weight: 700; }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <h1>Fourier Lab</h1>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-build" aria-selected="true">Build</button>
        <button role="tab" id="tab-draw" aria-selected="false">Draw</button>
      </div>
      <span class="hint" id="hint"></span>
    </header>
    <div class="row" id="presets"></div>
    <div class="panes">
      <div class="pane"><h2><span>Wave</span><small id="wave-note"></small></h2><canvas id="wave"></canvas></div>
      <div class="pane"><h2><span>Spectrum</span><small id="spec-note"></small></h2><canvas id="spec"></canvas></div>
    </div>
    <footer>
      <span id="kbox" class="hide">
        <label for="k">Rebuild with <span id="kv">1</span> sine<span id="ks"></span></label>
        <input id="k" type="range" min="1" max="24" value="5" />
        <span class="match" id="match"></span>
      </span>
      <button class="main" id="hear" aria-pressed="false">🔊 Hear it</button>
      <button class="main go" id="go">Continue ▶</button>
    </footer>
  </div>
  <script>
    ToyBox.defaults({ harmonics: 12, startPreset: 'square' });

    ToyBox.onInit(function (p) {
      var $ = function (id) { return document.getElementById(id); };
      var HB = p.harmonics || 12;     // bars in Build mode
      var HD = 24;                    // harmonics analysed in Draw mode
      var N = 256;                    // samples per cycle
      var mode = 'build', preset = null, tried = {}, drew = false;
      var b = new Float32Array(HB + 1);           // Build: sine coefficient of each harmonic
      var samples = new Float32Array(N);          // Draw: the learner's wave
      var A = new Float32Array(HD + 1), B = new Float32Array(HD + 1); // Draw: DFT result
      for (var i = 0; i < N; i++) samples[i] = 0.8 * Math.sin(2 * Math.PI * i / N);

      var PRESETS = {
        sine:     function (n) { return n === 1 ? 1 : 0; },
        square:   function (n) { return n % 2 ? 1 / n : 0; },
        sawtooth: function (n) { return 0.6 * (n % 2 ? 1 : -1) / n; },
        triangle: function (n) { return n % 2 ? 0.8 * (((n - 1) / 2) % 2 ? -1 : 1) / (n * n) : 0; },
        random:   function (n) { return n === 1 ? 0.8 : Math.random() < 0.4 ? (Math.random() * 0.6) / Math.sqrt(n) : 0; },
      };
      function setPreset(name) {
        preset = name; tried[name] = true;
        for (var n = 1; n <= HB; n++) b[n] = PRESETS[name](n);
        renderPresets(); changed();
      }
      function renderPresets() {
        var row = $('presets'); row.innerHTML = '';
        if (mode === 'build') {
          Object.keys(PRESETS).forEach(function (name) {
            var c = document.createElement('button');
            c.className = 'chip' + (preset === name ? ' on' : ''); c.textContent = name[0].toUpperCase() + name.slice(1);
            c.onclick = function () { setPreset(name); }; row.appendChild(c);
          });
          var clr = document.createElement('button'); clr.className = 'chip'; clr.textContent = 'Clear';
          clr.onclick = function () { b.fill(0); preset = null; renderPresets(); changed(); }; row.appendChild(clr);
        } else {
          [['Clear', function () { samples.fill(0); }], ['Sine', function () { for (var i = 0; i < N; i++) samples[i] = 0.8 * Math.sin(2 * Math.PI * i / N); }],
           ['Heartbeat', heartbeat]].forEach(function (x) {
            var c = document.createElement('button'); c.className = 'chip'; c.textContent = x[0];
            c.onclick = function () { x[1](); analyse(); changed(); }; row.appendChild(c);
          });
        }
      }
      function heartbeat() {
        for (var i = 0; i < N; i++) {
          var u = i / N;
          samples[i] = 0.15 * Math.exp(-Math.pow((u - 0.2) / 0.04, 2)) - 0.2 * Math.exp(-Math.pow((u - 0.4) / 0.012, 2)) +
            0.95 * Math.exp(-Math.pow((u - 0.43) / 0.012, 2)) - 0.3 * Math.exp(-Math.pow((u - 0.46) / 0.012, 2)) +
            0.25 * Math.exp(-Math.pow((u - 0.7) / 0.05, 2)) - 0.1;
        }
      }

      // ---------- the maths: a discrete Fourier transform (what an FFT computes, just more slowly)
      function analyse() {
        for (var k = 0; k <= HD; k++) {
          var re = 0, im = 0;
          for (var n = 0; n < N; n++) { var t = 2 * Math.PI * k * n / N; re += samples[n] * Math.cos(t); im += samples[n] * Math.sin(t); }
          A[k] = (k ? 2 : 1) * re / N; B[k] = (k ? 2 : 1) * im / N;
        }
      }
      function rebuild(u, K) {
        var y = A[0];
        for (var k = 1; k <= K; k++) y += A[k] * Math.cos(2 * Math.PI * k * u) + B[k] * Math.sin(2 * Math.PI * k * u);
        return y;
      }
      function matchPct(K) {
        var err = 0, pow = 0;
        for (var n = 0; n < N; n++) { var d = samples[n] - rebuild(n / N, K); err += d * d; pow += Math.pow(samples[n] - A[0], 2); }
        return pow < 1e-6 ? 100 : Math.max(0, 100 * (1 - Math.sqrt(err / pow)));
      }

      // ---------- sound: the same coefficients become a WebAudio PeriodicWave
      var audio = null, soundDirty = false;
      function sound() {
        if (!audio) return;
        var real, imag;
        if (mode === 'build') { real = new Float32Array(HB + 1); imag = Float32Array.from(b); imag[0] = 0; }
        else { var K = Number($('k').value); real = Float32Array.from(A.slice(0, K + 1)); imag = Float32Array.from(B.slice(0, K + 1)); real[0] = imag[0] = 0; }
        var any = imag.some(function (v) { return v; }) || real.some(function (v) { return v; });
        audio.gain.gain.setTargetAtTime(any ? 0.15 : 0, audio.ctx.currentTime, 0.02);
        if (any) audio.osc.setPeriodicWave(audio.ctx.createPeriodicWave(real, imag));
      }
      $('hear').onclick = function () {
        if (audio) { audio.ctx.close(); audio = null; this.textContent = '🔊 Hear it'; this.setAttribute('aria-pressed', 'false'); return; }
        var ac = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ac.createOscillator(), g = ac.createGain();
        osc.frequency.value = 165; g.gain.value = 0;
        osc.connect(g).connect(ac.destination); osc.start();
        audio = { ctx: ac, osc: osc, gain: g };
        this.textContent = '🔇 Stop sound'; this.setAttribute('aria-pressed', 'true');
        sound();
      };
      function changed() { soundDirty = true; updateText(); }

      // ---------- modes
      function setMode(m) {
        mode = m; tried[m] = true;
        $('tab-build').setAttribute('aria-selected', m === 'build');
        $('tab-draw').setAttribute('aria-selected', m === 'draw');
        $('kbox').classList.toggle('hide', m !== 'draw');
        $('wave').classList.toggle('drawable', m === 'draw');
        $('spec').classList.toggle('editable', m === 'build');
        $('hint').textContent = m === 'build'
          ? 'Drag the spectrum bars (or pick a preset) to mix sines into a wave'
          : 'Draw any wave with your mouse or finger; the FFT finds its sines';
        $('wave-note').textContent = m === 'build' ? '2 cycles' : 'draw one cycle';
        $('spec-note').textContent = m === 'build' ? 'drag bars ↕' : 'computed from your drawing';
        if (m === 'draw') analyse();
        renderPresets(); changed();
      }
      $('tab-build').onclick = function () { setMode('build'); };
      $('tab-draw').onclick = function () { setMode('draw'); };
      $('k').oninput = changed;

      function updateText() {
        var K = Number($('k').value);
        $('kv').textContent = K; $('ks').textContent = K > 1 ? 's' : '';
        if (mode === 'draw') $('match').textContent = matchPct(K).toFixed(0) + '% match';
      }

      // ---------- pointer input
      var wave = $('wave'), spec = $('spec');
      var drawing = false, last = null;
      function waveInput(e) {
        var r = wave.getBoundingClientRect(), pad = 12;
        var i = Math.round(((e.clientX - r.left - pad) / (r.width - 2 * pad)) * (N - 1));
        var v = Math.max(-1, Math.min(1, -((e.clientY - r.top) - r.height / 2) / (r.height * 0.42)));
        i = Math.max(0, Math.min(N - 1, i));
        if (last) { // fill the gap between pointer events
          var i0 = last[0], v0 = last[1], steps = Math.abs(i - i0);
          for (var s = 1; s <= steps; s++) samples[i0 + Math.sign(i - i0) * s] = v0 + (v - v0) * s / steps;
        }
        samples[i] = v; last = [i, v]; drew = true;
        analyse(); changed();
      }
      wave.addEventListener('pointerdown', function (e) { if (mode !== 'draw') return; drawing = true; last = null; wave.setPointerCapture(e.pointerId); waveInput(e); });
      wave.addEventListener('pointermove', function (e) { if (drawing) waveInput(e); });
      wave.addEventListener('pointerup', function () { drawing = false; });

      var editing = false;
      function specInput(e) {
        var r = spec.getBoundingClientRect(), pad = 12, base = r.height - 26, top = 14;
        var n = Math.floor(((e.clientX - r.left - pad) / (r.width - 2 * pad)) * HB) + 1;
        if (n < 1 || n > HB) return;
        var v = Math.max(0, Math.min(1, (base - (e.clientY - r.top)) / (base - top)));
        b[n] = (b[n] < 0 ? -1 : 1) * (v < 0.03 ? 0 : v);
        preset = null; renderPresets(); changed();
      }
      spec.addEventListener('pointerdown', function (e) { if (mode !== 'build') return; editing = true; spec.setPointerCapture(e.pointerId); specInput(e); });
      spec.addEventListener('pointermove', function (e) { if (editing) specInput(e); });
      spec.addEventListener('pointerup', function () { editing = false; });

      $('go').onclick = function () {
        if (audio) audio.ctx.close();
        ToyBox.complete({ triedModes: Object.keys(tried).filter(function (k) { return k === 'build' || k === 'draw'; }), presets: Object.keys(tried).filter(function (k) { return PRESETS[k]; }), drewOwnWave: drew });
      };

      // ---------- drawing
      var COLORS = ['#22d3ee', '#f472b6', '#a78bfa', '#4ade80', '#f59e0b'];
      function fit(c) {
        var dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
        if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
        var x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
        return [x, w, h];
      }
      function plot(ctx, w, h, fn, color, width, cycles) {
        var pad = 12, yc = h / 2, amp = h * 0.42;
        ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
        for (var i = 0; i <= 600; i++) {
          var u = i / 600, y = yc - amp * Math.max(-1.15, Math.min(1.15, fn(u * cycles)));
          i ? ctx.lineTo(pad + (w - 2 * pad) * u, y) : ctx.moveTo(pad + (w - 2 * pad) * u, y);
        }
        ctx.stroke();
      }
      function frame() {
        if (soundDirty) { soundDirty = false; sound(); }
        var K = Number($('k').value);
        // wave pane
        var r = fit(wave), ctx = r[0], w = r[1], h = r[2];
        ctx.strokeStyle = '#38446e'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(12, h / 2); ctx.lineTo(w - 12, h / 2); ctx.stroke();
        if (mode === 'build') {
          var shown = 0;
          for (var n = 1; n <= HB; n++) if (b[n]) {
            (function (n) { plot(ctx, w, h, function (u) { return b[n] * Math.sin(2 * Math.PI * n * u); }, COLORS[shown++ % 5] + '55', 1.5, 2); })(n);
          }
          plot(ctx, w, h, function (u) { var y = 0; for (var n = 1; n <= HB; n++) y += b[n] * Math.sin(2 * Math.PI * n * u); return y; }, '#f59e0b', 3.5, 2);
        } else {
          plot(ctx, w, h, function (u) { return samples[Math.min(N - 1, Math.floor(u * N))]; }, '#ffffffaa', 2, 1);
          plot(ctx, w, h, function (u) { return rebuild(u, K); }, '#f59e0b', 3.5, 1);
          if (!drew) { ctx.fillStyle = '#94a3b8'; ctx.font = '600 14px system-ui'; ctx.textAlign = 'center'; ctx.fillText('✎ draw here', w / 2, h * 0.88); }
        }
        // spectrum pane
        r = fit(spec); ctx = r[0]; w = r[1]; h = r[2];
        var pad = 12, base = h - 26, top = 14, count = mode === 'build' ? HB : HD, bw = (w - 2 * pad) / count;
        ctx.strokeStyle = '#38446e'; ctx.beginPath(); ctx.moveTo(pad, base); ctx.lineTo(w - pad, base); ctx.stroke();
        ctx.font = '10px system-ui'; ctx.textAlign = 'center';
        for (var k = 1; k <= count; k++) {
          var mag = mode === 'build' ? Math.abs(b[k]) : Math.min(1, Math.hypot(A[k], B[k]));
          var on = mode === 'build' || k <= K;
          var x = pad + (k - 0.5) * bw;
          ctx.fillStyle = mode === 'build' ? '#ffffff0d' : 'transparent';
          ctx.fillRect(x - bw * 0.38, top, bw * 0.76, base - top);
          ctx.fillStyle = on ? COLORS[(k - 1) % 5] : '#475569';
          ctx.fillRect(x - bw * 0.38, base - (base - top) * mag, bw * 0.76, (base - top) * mag);
          if (count <= 12 || k % 2 === 1) { ctx.fillStyle = '#64748b'; ctx.fillText(k + 'f', x, base + 14); }
        }
        requestAnimationFrame(frame);
      }

      setMode('build');
      setPreset(p.startPreset || 'square');
      requestAnimationFrame(frame);
    });
  </script>
</body>
</html>
