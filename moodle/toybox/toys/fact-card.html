<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fact card</title>
  <script src="../toybox-sdk.js"></script>
  <style>
    :root { font-family: system-ui, sans-serif; color: #fff; }
    html, body { margin: 0; height: 100%; background: transparent; }
    .card {
      box-sizing: border-box; height: 100%; padding: 6% 8%; position: relative; overflow: hidden;
      background: #0f172ad9; border: 1px solid #ffffff33; border-radius: 14px;
      display: flex; gap: 6%; align-items: center; cursor: pointer;
      animation: pop .35s cubic-bezier(.2, 1.4, .4, 1);
    }
    @keyframes pop { from { transform: scale(.7); opacity: 0; } }
    .emoji { font-size: clamp(22px, 9vw, 48px); }
    .text { font-size: clamp(11px, 4.5vw, 18px); line-height: 1.3; }
    .more { display: none; font-size: .85em; opacity: .85; margin-top: .4em; }
    .card.open .more { display: block; }
    .timer { position: absolute; left: 0; bottom: 0; height: 4px; background: #f59e0b; transition: width .25s linear; }
  </style>
</head>
<body>
  <div class="card" id="card" role="button" tabindex="0">
    <div class="emoji" id="emoji">💡</div>
    <div class="text"><div id="text"></div><div class="more" id="more"></div></div>
    <div class="timer" id="timer"></div>
  </div>
  <script>
    ToyBox.defaults({ emoji: '🎵', text: 'A ¾ time signature means 3 quarter-note beats per bar.', more: 'Waltzes are in ¾!' });

    // A non-blocking toy: the video keeps playing; tap to learn more.
    ToyBox.onInit(function (p, cue) {
      document.getElementById('emoji').textContent = p.emoji || '💡';
      document.getElementById('text').textContent = p.text;
      document.getElementById('more').textContent = p.more ? p.more + ' (tap to close)' : '';
      var card = document.getElementById('card'), opened = false;
      card.onclick = function () {
        card.classList.toggle('open');
        if (!opened) { opened = true; ToyBox.complete({ opened: true }); }
      };
      if (cue && ToyBox.hasVideo) ToyBox.onTime(function (t) {
        var left = Math.max(0, (cue.end - t) / (cue.end - cue.start));
        document.getElementById('timer').style.width = (left * 100) + '%';
      });
    });
  </script>
</body>
</html>
