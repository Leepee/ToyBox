<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ToyBox Player</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="app">
    <a class="brand" href="./"><span class="mark" aria-hidden="true">▶</span>ToyBox</a>
    <nav aria-label="ToyBox pages">
      <a href="./" aria-current="page">Lessons</a>
      <a href="./toy.html">Toy only</a>
      <a href="./playground.html">Toy playground</a>
    </nav>
    <span class="spacer"></span>
    <label class="theme-pick">Theme <select class="btn" id="theme-pick"></select></label>
  </header>
  <div class="band"><div class="wrap">
    <h1 id="lesson-heading">Lessons</h1>
    <select class="btn lesson-pick" id="lesson-pick" aria-label="Choose a lesson"></select>
    <p id="lesson-title">Loading lesson…</p>
  </div></div>
  <main class="lesson">
    <div class="panel stage-card"><div id="player"></div></div>
    <aside class="panel">
      <h2>Lesson progress</h2>
      <ul class="log" id="log"></ul>
    </aside>
  </main>
  <footer class="app"><div class="wrap">ToyBox · interactive video and toys for learning · <a href="https://github.com/Leepee/ToyBox">source</a></div></footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
