<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ToyBox Toy Only</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="app">
    <a class="brand" href="./"><span class="mark" aria-hidden="true">▶</span>ToyBox</a>
    <nav aria-label="ToyBox pages">
      <a href="./">Lessons</a>
      <a href="./toy.html" aria-current="page">Toy only</a>
      <a href="./playground.html">Toy playground</a>
    </nav>
    <span class="spacer"></span>
    <label class="theme-pick">Theme <select class="btn" id="theme-pick"></select></label>
  </header>
  <div class="band"><div class="wrap">
    <h1>Toy only</h1>
    <p>No video, just a toy on a course page.</p>
  </div></div>
  <main class="toy-page">
    <div class="toolbar">
      <select class="btn" id="pick" aria-label="Choose a toy"></select>
      <select class="btn" id="shape" aria-label="Shape">
        <option value="16:9">16:9 (wide)</option>
        <option value="4:3">4:3</option>
        <option value="1:1">Square</option>
        <option value="auto">Fit content</option>
      </select>
    </div>
    <article class="panel">
      <h2 id="topic">Week 3 · Waves</h2>
      <p class="intro" id="intro"></p>
    </article>
    <div id="toy"></div>
    <article class="panel">
      <h2>Progress</h2>
      <p class="intro" id="status">Not finished yet.</p>
    </article>
  </main>
  <footer class="app"><div class="wrap">ToyBox · interactive video and toys for learning · <a href="https://github.com/Leepee/ToyBox">source</a></div></footer>
  <script type="module" src="/src/toy.ts"></script>
</body>
</html>
