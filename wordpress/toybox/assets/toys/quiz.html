<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Quick quiz</title>
  <script src="../toybox-sdk.js"></script>
  <style>
    :root { font-family: var(--tb-font); color: var(--tb-text); }
    html, body { margin: 0; height: 100%; background: transparent; }
    .card {
      box-sizing: border-box; height: 100%; padding: 4% 5%; overflow: auto;
      background: var(--tb-surface); border: 1px solid var(--tb-border); border-radius: var(--tb-radius); box-shadow: var(--tb-shadow);
      display: flex; flex-direction: column; gap: 3%; justify-content: center;
    }
    h1 { font-size: clamp(14px, 4.2vw, 24px); margin: 0 0 2%; }
    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .opts button {
      font-size: clamp(14px, 4.5vw, 26px); font-weight: 700; padding: .5em; cursor: pointer;
      border: 2px solid var(--tb-border); border-radius: var(--tb-radius); background: var(--tb-surface-alt); color: inherit;
    }
    .opts button:hover { border-color: var(--tb-primary); }
    .opts button.right { background: color-mix(in srgb, var(--tb-success) 15%, var(--tb-surface)); border-color: var(--tb-success); }
    .opts button.wrong { background: color-mix(in srgb, var(--tb-danger) 15%, var(--tb-surface)); border-color: var(--tb-danger); }
    .fb { font-size: clamp(12px, 3vw, 17px); min-height: 1.4em; }
    .rewatch { margin-left: 8px; border: 0; border-radius: var(--tb-button-radius); padding: .35em 1em; background: var(--tb-primary); color: var(--tb-on-primary); cursor: pointer; font: inherit; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="q"></h1>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
  </div>
  <script>
    ToyBox.defaults({ question: 'Which is bigger?', options: ['2/3', '3/5'], answer: 0, explain: '2/3 = 10/15 and 3/5 = 9/15.' });

    ToyBox.onInit(function (p) {
      var tries = 0;
      document.getElementById('q').textContent = p.question;
      var opts = document.getElementById('opts'), fb = document.getElementById('fb');
      opts.innerHTML = '';
      p.options.forEach(function (label, i) {
        var b = document.createElement('button');
        b.textContent = label;
        b.onclick = function () {
          tries++;
          if (i === p.answer) {
            b.className = 'right';
            fb.textContent = '✅ Correct! ' + (p.explain || '');
            setTimeout(function () { ToyBox.complete({ correct: true, tries: tries }); }, 1800);
          } else {
            b.className = 'wrong';
            fb.textContent = '❌ Not quite. ' + (ToyBox.hasVideo ? '' : 'Have another go!');
            if (p.rewatchAt != null && ToyBox.hasVideo) {
              var r = document.createElement('button');
              r.className = 'rewatch';
              r.textContent = '↺ Rewatch the explanation';
              r.onclick = function () { ToyBox.log({ rewatched: true }); ToyBox.seek(p.rewatchAt); ToyBox.play(); };
              fb.appendChild(r);
            }
          }
        };
        opts.appendChild(b);
      });
    });
  </script>
</body>
</html>
